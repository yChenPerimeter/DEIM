__include__: [
  '../base/dataloader.yml',
  '../base/dfine_hgnetv2.yml',
  '../base/optimizer.yml',
  '../base/deim.yml',
  '../dataset/mother_data_detection.yml',
  '../runtime.yml'
]

# Override for mother data
task: detection
num_classes: 2  # DCIS and IDC
remap_mscoco_category: False

# Dataset configuration
train_dataloader:
  dataset:
    type: CocoDetection
    img_folder: /home/ychen/Documents/project/mother_data/deim_coco_format/train
    ann_file: /home/ychen/Documents/project/mother_data/deim_coco_format/annotations/train.json
    return_masks: False

val_dataloader:
  dataset:
    type: CocoDetection
    img_folder: /home/ychen/Documents/project/mother_data/deim_coco_format/val
    ann_file: /home/ychen/Documents/project/mother_data/deim_coco_format/annotations/val.json
    return_masks: False

# Configure HGNetv2 backbone for large variant
HGNetv2:
  name: 'B4'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True

# Optimizer configuration from original L model
optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0000125
    - 
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

# Training settings for smaller dataset
epoches: 30  # Reduced from 58

# Adjust LR scheduler for shorter training
flat_epoch: 15    # 4 + 30 // 2 - 1
no_aug_epoch: 4

train_dataloader:
  total_batch_size: 8
  dataset:
    type: CocoDetection
    img_folder: /home/ychen/Documents/project/mother_data/deim_coco_format/train
    ann_file: /home/ychen/Documents/project/mother_data/deim_coco_format/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: [2, 15, 25]   # Adjusted for 30 epochs
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.5
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 3
    mixup_prob: 0.5
    mixup_epochs: [2, 15]
    stop_epoch: 25

val_dataloader:
  total_batch_size: 8
  dataset:
    type: CocoDetection
    img_folder: /home/ychen/Documents/project/mother_data/deim_coco_format/val
    ann_file: /home/ychen/Documents/project/mother_data/deim_coco_format/annotations/val.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  collate_fn:
    type: BatchImageCollateFunction

# Output directory
output_dir: ./outputs/deim_hgnetv2_l_mother_data_v2

# Evaluation
evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']