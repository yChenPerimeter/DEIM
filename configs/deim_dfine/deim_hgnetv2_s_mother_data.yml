__include__:
  - ../base/dataloader.yml
  - ../base/dfine_hgnetv2.yml
  - ../base/optimizer.yml
  - ../base/deim.yml
  - ../dataset/mother_data_detection.yml
  - ../runtime.yml

# Model configuration
num_classes: 2  # DCIS and IDC

# Configure HGNetv2 backbone for small variant
HGNetv2:
  name: 'B0'  # Small variant
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

# Configure encoder for small variant
HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

# Configure decoder for small variant
DFINETransformer:
  num_layers: 3
  eval_idx: -1

# Override backbone pretrained path if needed
# pretrained: null

# Training settings
epoches: 10  # You can adjust based on dataset size
start_epoch: 0

# Override batch size for smaller dataset
train_dataloader:
  total_batch_size: 16  # Reduce if GPU memory limited

val_dataloader:
  total_batch_size: 16

# Optimizer configuration
optimizer:
  type: AdamW
  params:
    - 
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    - 
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.
    - 
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Evaluation settings
eval_spatial_size: [1024, 1024]  # Adjust based on your image sizes

# Save settings
checkpoint_dir: ./outputs/mother_data/
save_checkpoint_interval: 10
eval_during_training: True
eval_interval: 5

# Early stopping (optional)
# early_stop_patience: 20

# Mixed precision training
use_amp: True

# Logging
print_freq: 20
summary_writer:
  enabled: True
  log_dir: ./outputs/mother_data/logs/